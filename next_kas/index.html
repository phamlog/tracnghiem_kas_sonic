        }

        .subtitle {

            color: #666;
            margin-bottom: 30px;

        }

        }

        .question-block.incorrect {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .question-block.answered {

        }

        .question-text {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #333;
        }

        .options {
            list-style: none;
            margin-bottom: 15px;
        }

        .option {
            margin: 10px 0;
            padding: 12px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover:not(.disabled) {
            background: #e9ecef;
            border-color: #667eea;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            display: inline;
        }

        .option.selected {
            background: #e7f3ff;
            border-color: #667eea;
        }

        .option.correct-option {
            background: #d4edda;
            border-color: #28a745;
        }

        .option.wrong-option {
            background: #f8d7da;
            border-color: #dc3545;
        }

            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .explanation.show {
            display: block;
        }

        .correct-answer {
            color: #28a745;
            font-weight: bold;
        }

        .wrong-answer {
            color: #dc3545;
            font-weight: bold;
        }

        .check-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .check-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .check-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            position: sticky;
            top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            z-index: 100;
        }

        .stats h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s;
        }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;

        }

        .reset-btn:hover {
            background: #667eea;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 30px 0 20px 0;
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

                options: ["Không có thay đổi", "Security for Microsoft 365 becomes inactive", "Tất cả features giữ nguyên", "Phải reinstall tất cả"],
                correct: 1,
                explanation: "Khi migrate từ KES Cloud Plus sang Next EDR Foundations, Kaspersky Security for Microsoft Office 365 component sẽ become INACTIVE vì EDR Foundations không bao gồm feature này."
            },
            {
                question: "97. Có thể migrate tự động từ Pro View sang Expert View không?",
                options: ["Không", "Có, nếu activation code covers 300+ users", "Có, với bất kỳ số users nào", "Chỉ với support"],
                correct: 1,
                explanation: "Có thể migrate tự động từ Pro View sang Expert View, provided activation code meets requirements for Expert View cloud console (covers 300 users or more)."
            },
            {
                question: "98. Migration từ Pro View sang Expert View có migrate những gì?",
                options: ["Chỉ users", "Users, devices, profiles, settings", "Chỉ devices", "Không migrate gì"],
                correct: 1,
                explanation: "Migration includes: (1) Users và groups, (2) Windows/Linux/macOS devices, (3) Security profiles, (4) Malware scan/update settings, (5) Vulnerability/IoC settings. KHÔNG migrate: Android/iOS, packages, EDR alerts, event log."
            },
            {
                question: "99. Migration process có thể mất bao lâu?",
                options: ["Vài giây", "Vài phút", "Several hours", "Vài ngày"],
                correct: 2,
                explanation: "Migration process từ Pro View sang Expert View có thể take SEVERAL HOURS tùy thuộc vào lượng data và số devices cần migrate."
            },
            {
                question: "100. Kaspersky Next XDR Optimum license activates những gì?",
                options: ["Chỉ KSC Server", "Chỉ KES", "KSC Server, KES with EDR, Cloud Sandbox, KASAP", "Chỉ Cloud Sandbox"],
                correct: 2,
                explanation: "XDR Optimum license activates: (1) KSC Administration Server để enable XDR features, (2) KES with EDR Optimum component, (3) Cloud Sandbox queries (0.5x licenses/year), (4) KASAP training slots (0.2x licenses)."
            }
        ];

        let stats = {
            answered: 0,
            correct: 0,
            wrong: 0
        };

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            let currentCategory = '';

            questions.forEach((q, index) => {
                // Add category header if new category
                if (q.category && q.category !== currentCategory) {
                    currentCategory = q.category;
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category-header';
                    categoryDiv.textContent = currentCategory;
                    container.appendChild(categoryDiv);
                }

                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-block';
                questionDiv.id = `question-${index}`;

                let optionsHtml = '<ul class="options">';
                q.options.forEach((option, optIndex) => {
                    optionsHtml += `
                        <li class="option" onclick="selectOption(${index}, ${optIndex})" id="q${index}_opt${optIndex}">
                            <input type="radio" name="question${index}" value="${optIndex}">
                            <label>${option}</label>
                        </li>
                    `;
                });
                optionsHtml += '</ul>';

                questionDiv.innerHTML = `
                    <div class="question-text">${q.question}</div>
                    ${optionsHtml}
                    <button class="check-btn" onclick="checkAnswer(${index})" id="checkBtn-${index}">✓ Xác Nhận Câu Này</button>
                    <div class="explanation" id="explanation-${index}"></div>
                `;

                container.appendChild(questionDiv);
            });
        }

        function selectOption(questionIndex, optionIndex) {
            const questionBlock = document.getElementById(`question-${questionIndex}`);
            if (questionBlock.classList.contains('answered')) return;

            const options = questionBlock.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));

            const selectedOption = document.getElementById(`q${questionIndex}_opt${optionIndex}`);
            selectedOption.classList.add('selected');
            selectedOption.querySelector('input').checked = true;
        }

        function checkAnswer(questionIndex) {
            const questionBlock = document.getElementById(`question-${questionIndex}`);
            if (questionBlock.classList.contains('answered')) return;

            const radio = document.querySelector(`input[name="question${questionIndex}"]:checked`);
            if (!radio) {
                alert('⚠️ Vui lòng chọn một đáp án trước khi xác nhận!');
                return;
            }

            const userAnswer = parseInt(radio.value);
            const correctAnswer = questions[questionIndex].correct;
            const isCorrect = userAnswer === correctAnswer;

            const options = questionBlock.querySelectorAll('.option');
            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                opt.style.pointerEvents = 'none';

                if (idx === correctAnswer) {
                    opt.classList.add('correct-option');
                }
                if (idx === userAnswer && !isCorrect) {
                    opt.classList.add('wrong-option');
                }
            });

            const explanation = document.getElementById(`explanation-${questionIndex}`);
            if (isCorrect) {
                questionBlock.classList.add('correct');
                explanation.innerHTML = `<span class="correct-answer">✓ Chính Xác!</span> ${questions[questionIndex].explanation}`;
                stats.correct++;
            } else {
                questionBlock.classList.add('incorrect');
                explanation.innerHTML = `<span class="wrong-answer">✗ Chưa Đúng!</span> Đáp án đúng: <strong>${questions[questionIndex].options[correctAnswer]}</strong><br><br>${questions[questionIndex].explanation}`;
                stats.wrong++;
            }

            explanation.classList.add('show');
            questionBlock.classList.add('answered');

            document.getElementById(`checkBtn-${questionIndex}`).disabled = true;

            stats.answered++;
            updateStats();

            // Scroll to next unanswered question
            setTimeout(() => {
                const nextUnanswered = document.querySelector('.question-block:not(.answered)');
                if (nextUnanswered) {
                    nextUnanswered.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 500);
        }

        function updateStats() {
            document.getElementById('answeredCount').textContent = stats.answered;
            document.getElementById('correctCount').textContent = stats.correct;
            document.getElementById('wrongCount').textContent = stats.wrong;
            document.getElementById('progressText').textContent = `${stats.answered}/100`;

            const percentage = (stats.answered / questions.length) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';

            const scorePercentage = stats.answered > 0 ? ((stats.correct / stats.answered) * 100).toFixed(1) : 0;
            document.getElementById('scorePercent').textContent = scorePercentage + '%';
        }

        function resetQuiz() {
            if (stats.answered > 0 && !confirm('🔄 Bạn có chắc muốn làm lại từ đầu? Tất cả câu trả lời sẽ bị xóa.')) {
                return;
            }

            stats = { answered: 0, correct: 0, wrong: 0 };
            updateStats();
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            renderQuestions();
        };
    </script>
</body>
</html>
